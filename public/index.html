<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#000000" />
    <meta
      name="description"
      content="Adaptation Agency - Tech and strategic solutions for resilient businesses"
    />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.ico" />
    <!--
      manifest.json provides metadata used when your web app is installed on a
      user's mobile device or desktop. See https://developers.google.com/web/fundamentals/web-app-manifest/
    -->
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <!--
      Notice the use of %PUBLIC_URL% in the tags above.
      It will be replaced with the URL of the `public` folder during the build.
      Only files inside the `public` folder can be referenced from the HTML.

      Unlike "/favicon.ico" or "favicon.ico", "%PUBLIC_URL%/favicon.ico" will
      work correctly both with client-side routing and a non-root public URL.
      Learn how to configure a non-root public URL by running `npm run build`.
    -->
    <!-- Google Fonts - Manrope -->
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- AOS Library -->
    <link href="https://unpkg.com/aos@2.3.4/dist/aos.css" rel="stylesheet">
    <title>Adaptations</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <!--
      This HTML file is a template.
      If you open it directly in the browser, you will see an empty page.

      You can add webfonts, meta tags, or analytics to this file.
      The build step will place the bundled scripts into the <body> tag.

      To begin the development, run `npm start` or `yarn start`.
      To create a production bundle, use `npm run build` or `yarn build`.
    -->
    <!-- AOS Script -->
    <script src="https://unpkg.com/aos@2.3.4/dist/aos.js"></script>
    <script>
      document.addEventListener('DOMContentLoaded', function() {
        AOS.init({
          duration: 1000,
          once: true,
          disable: 'mobile',
          startEvent: 'load'
        });
      });
    </script>
    <script>
      // Fallback 100dvh for browsers that do not support it
      function setNavHeight() {
        var navs = document.querySelectorAll('nav');
        if (!CSS.supports('height: 100dvh')) {
          var vh = window.innerHeight * 0.01;
          navs.forEach(function(nav) {
            nav.style.height = (vh * 100) + 'px';
          });
        }
      }
      window.addEventListener('resize', setNavHeight);
      window.addEventListener('orientationchange', setNavHeight);
      document.addEventListener('DOMContentLoaded', setNavHeight);
    </script>
    <script>
      // Variable CSS dynamique pour la hauteur du viewport mobile
      function setVh() {
        document.documentElement.style.setProperty('--vh', window.innerHeight * 0.01 + 'px');
      }
      window.addEventListener('resize', setVh);
      window.addEventListener('orientationchange', setVh);
      setVh();
    </script>
    <script>
      window.onerror = function (message, source, lineno, colno, error) {
        document.body.innerHTML = '<pre style="color:red;white-space:pre-wrap;">JS ERROR: ' + message + '\n' + (error && error.stack ? error.stack : '') + '</pre>';
      };
    </script>
  </body>
</html>
